# ========================================================
# WanderLust Tourist Planner - Spring Boot Configuration
# ========================================================

server.port=8080
spring.application.name=tourist-planner-backend

# --------------------------------------------------------
# Database Configuration (H2 / MySQL)
# Default is H2 file-backed/in-memory for instant plug & play demo
# To use MySQL, uncomment MySQL block below and comment H2 block
# --------------------------------------------------------

# --- H2 In-Memory / File Database (Instant Setup) ---
spring.datasource.url=jdbc:h2:mem:touristdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL Database Option (Uncomment to use MySQL) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/tourist_planner_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- JPA / Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Jackson JSON Settings ---
spring.jackson.serialization.indent-output=true
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# --- Logging ---
logging.level.com.touristplanner=INFO
logging.level.org.springframework.web=INFO
